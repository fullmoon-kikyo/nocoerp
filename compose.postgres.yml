services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_DB: nocoerp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nocoerp']
      interval: 5s
      timeout: 5s
      retries: 12

secrets:
  postgres_admin_password:
    file: ./storage/local/postgres-admin-password

volumes:
  postgres_data:
